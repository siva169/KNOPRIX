# Render blueprint — deploy the FastAPI backend from GitHub.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. https://render.com → New → Blueprint → connect the repo.
#   3. After first deploy, edit CORS_ORIGINS in Render → Environment to the
#      exact Vercel origin (https://your-site.vercel.app).
services:
  - type: web
    name: knoprix-midreview-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-SITE.vercel.app
      # Supabase PostgreSQL is required because Render's local filesystem is
      # ephemeral and cannot persist SQLite data between restarts.
      - key: DATABASE_URL
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        value: knoprix-documents
      # Native Supabase Storage REST API: project URL + service_role secret.
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_API_KEY
        sync: false
