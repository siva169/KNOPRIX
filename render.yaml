# Render blueprint — deploy the FastAPI backend from GitHub.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. https://render.com → New → Blueprint → connect the repo.
#   3. After first deploy, edit the CORS_ORIGINS env var in Render → Environment
#      to your real Netlify URL (https://your-site.netlify.app).
services:
  - type: web
    name: knoprix-midreview-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-NETLIFY-SITE.netlify.app # <-- replace after deploy
      # Persistent Postgres (Neon). REQUIRED — Render's free tier uses an
      # ephemeral disk that wipes the local SQLite file on every restart,
      # deleting user accounts and documents. Paste your Neon connection
      # string here; the backend then stores everything in Postgres.
      - key: DATABASE_URL
        value: postgresql://USER:PASSWORD@host/dbname?sslmode=require
