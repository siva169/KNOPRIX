<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PDF.js smoke test</title>
  </head>
  <body>
    <canvas id="page"></canvas>
    <div id="text-layer"></div>
    <script type="module">
      import * as pdfjsLib from 'pdfjs-dist';
      import workerUrl from 'pdfjs-dist/build/pdf.worker.min.mjs?url';

      pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;

      function makePdf() {
        const content = 'BT /F1 12 Tf 20 100 Td (Knoprix PDF smoke) Tj ET\n';
        const objects = [
          '<< /Type /Catalog /Pages 2 0 R >>',
          '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
          '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 200 200] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
          '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
          `<< /Length ${content.length} >>\nstream\n${content}endstream`,
        ];
        let source = '%PDF-1.4\n';
        const offsets = [0];
        for (let index = 0; index < objects.length; index += 1) {
          offsets.push(new TextEncoder().encode(source).length);
          source += `${index + 1} 0 obj\n${objects[index]}\nendobj\n`;
        }
        const xrefOffset = new TextEncoder().encode(source).length;
        source += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
        source += offsets
          .slice(1)
          .map((offset) => `${String(offset).padStart(10, '0')} 00000 n \n`)
          .join('');
        source += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
        return new TextEncoder().encode(source);
      }

      try {
        const pdf = await pdfjsLib.getDocument({ data: makePdf() }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1 });
        const canvas = document.querySelector('#page');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        const textContent = await page.getTextContent();
        const textLayer = document.querySelector('#text-layer');
        const textLayerRenderer = new pdfjsLib.TextLayer({
          textContentSource: textContent,
          container: textLayer,
          viewport,
        });
        await textLayerRenderer.render();

        if (!textLayer.textContent.includes('Knoprix PDF smoke')) {
          throw new Error('PDF text layer did not contain the expected text');
        }
        document.documentElement.dataset.pdfjsStatus = 'passed';
      } catch (error) {
        document.body.textContent = error.stack || error.message;
        document.documentElement.dataset.pdfjsStatus = 'failed';
      }
    </script>
  </body>
</html>
